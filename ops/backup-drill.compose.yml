# Only scripts/backup-restore.mjs supplies this fixture's secrets and unique project.
# No external volumes, fixed ports, root .env, or normal development services.
x-postgres: &postgres
  image: postgres:18.6-bookworm
  environment:
    POSTGRES_DB: palmy
    POSTGRES_USER: palmy_owner
    POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
  ports: ["127.0.0.1::5432"]
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "palmy_owner", "-d", "palmy"]
    interval: 1s
    timeout: 3s
    retries: 60
x-cache: &cache
  image: valkey/valkey:9.1.2-alpine
  command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
  ports: ["127.0.0.1::6379"]
  healthcheck:
    test: ["CMD", "valkey-cli", "ping"]
    interval: 1s
    timeout: 3s
    retries: 60
services:
  source:
    <<: *postgres
    secrets:
      - source: source_password
        target: pg_password
    volumes: ["source-data:/var/lib/postgresql"]
  destination:
    <<: *postgres
    secrets:
      - source: destination_password
        target: pg_password
    volumes: ["destination-data:/var/lib/postgresql"]
  source-cache:
    <<: *cache
  destination-cache:
    <<: *cache
volumes:
  source-data:
  destination-data:
secrets:
  source_password:
    file: ${PALMY_DRILL_SECRET_DIR:?Use scripts/backup-restore.mjs}/source-password
  destination_password:
    file: ${PALMY_DRILL_SECRET_DIR:?Use scripts/backup-restore.mjs}/destination-password
